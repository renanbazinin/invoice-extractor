<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>landscape</title>
<!-- A landscape page (CSS @page size): wider than tall, text upright. -->
<style>
  @page { size: A4 landscape; margin: 20mm; }
  body { font-family: Arial; font-size: 12pt; margin: 0; }
  .row { display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="row"><span>חשבונית מס 555</span><span>Invoice 555</span></div>
  <div>סה"כ לתשלום: 99.90 ₪</div>
</body>
</html>
