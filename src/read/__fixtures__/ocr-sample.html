<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ocr-sample</title>
<!-- Source of the OCR fixtures (PNG "scan", scanned PDF, two-page TIFF). Rendered at a fixed
     CSS size so the screenshot holds the whole page. -->
<style>
  @page { size: 148mm 105mm; margin: 8mm; }
  html, body { margin: 0; background: #fff; }
  body { font-family: Arial; font-size: 15px; padding: 24px 28px; width: 600px; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  div { margin: 3px 0; }
  .kv { display: flex; justify-content: space-between; width: 340px; }
</style>
</head>
<body>
  <h1>חשבונית מס 2026-0042</h1>
  <div>אבג מערכות מידע בע"מ ח.פ. 512345678</div>
  <div>תאריך: 31/10/2026</div>
  <div>Invoice No: INV-778</div>
  <div class="kv"><span>סה"כ לפני מע"מ</span><span>1,000.00</span></div>
  <div class="kv"><span>מע"מ 18%</span><span>180.00</span></div>
  <div class="kv"><span>סה"כ לתשלום</span><span>1,180.00</span></div>
</body>
</html>
