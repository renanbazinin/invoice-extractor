<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>tables</title>
<!-- A bordered table (ruling lines between cells) and a borderless one (whitespace only). -->
<style>
  @page { size: A4; margin: 20mm; }
  body { font-family: Arial; font-size: 10pt; margin: 0; }
  h3 { font-size: 12pt; margin: 0 0 6pt; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 30pt; }
  .bordered th, .bordered td { border: 0.75pt solid #000; padding: 2pt 5pt; }
  .plain th, .plain td { padding: 4pt 10pt; }
  th { text-align: right; }
  td { text-align: right; }
  td.num, th.num { text-align: left; }
</style>
</head>
<body>
  <h3>טבלה עם מסגרת</h3>
  <table class="bordered">
    <tr><th>תיאור</th><th class="num">כמות</th><th class="num">מחיר יחידה</th><th class="num">סה"כ</th></tr>
    <tr><td>מחשב נייד Dell XPS 13</td><td class="num">2</td><td class="num">3,500.00</td><td class="num">7,000.00</td></tr>
    <tr><td>עכבר אלחוטי</td><td class="num">5</td><td class="num">45.90</td><td class="num">229.50</td></tr>
  </table>

  <h3>טבלה ללא מסגרת</h3>
  <table class="plain">
    <tr><th>תיאור</th><th class="num">כמות</th><th class="num">מחיר יחידה</th><th class="num">סה"כ</th></tr>
    <tr><td>מקלדת עברית/אנגלית</td><td class="num">3</td><td class="num">120.00</td><td class="num">360.00</td></tr>
    <tr><td>כבל HDMI 2 מטר</td><td class="num">10</td><td class="num">19.90</td><td class="num">199.00</td></tr>
  </table>
</body>
</html>
